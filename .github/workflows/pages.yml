name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@bosco98"

      # @bosco98/opencontrol-sdk comes from GitHub Packages (published by the
      # Opn-gamedeck repo). npm install (not ci) so the resolution happens
      # against the registry with the CI token. vite base "./" keeps the build
      # path-independent.
      # PACKAGES_READ_TOKEN (a PAT with read:packages) takes precedence; the
      # repo-scoped GITHUB_TOKEN works instead once this repo is granted
      # Actions access on the package.
      - name: Build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
